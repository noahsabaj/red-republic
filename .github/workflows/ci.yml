name: CI

# The gate, run on the machine that is not Noah's.
#
# Two jobs, and the split is the point. `dotnet test` needs no engine at all,
# because `src/RedRepublic.Sim` has no reference to Godot — that is what the
# boundary buys, and it is why the whole simulation suite runs in a couple of
# seconds. Only the second job needs the editor.

on:
  push:
  pull_request:

jobs:
  # The simulation, with no engine in the loop. If this fails the game cannot be
  # right whatever the editor says.
  #
  # Two operating systems on purpose, and it is not redundancy. Map generation
  # must reproduce ACROSS MACHINES — a shared seed is a promise between players —
  # so the pinned-worldgen tests are claims that can only be tested somewhere
  # other than where the pin was taken. A second OS and a second CPU vendor is
  # the cheapest real evidence for that rule available.
  simulation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the simulation
        run: dotnet test src/RedRepublic.Sim.Tests/RedRepublic.Sim.Tests.csproj -c Release --nologo

      # The trajectory asserts nothing — reading it is the point. It runs here so
      # a change that leaves the republic inert shows up in a log somebody can
      # read, rather than only when somebody thinks to run it.
      - name: Play the opening
        run: dotnet run --project src/RedRepublic.Trajectory -c Release -- 1961 3 plains

  # Does the game actually load?
  #
  # `dotnet test` does not open a scene, and the failures that hide there are the
  # ones that stop the game starting at all: a resource that will not resolve, a
  # building kind with no art authored for it, a shader that will not compile.
  loads:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # **The game's assembly has to exist before Godot can load it.** Godot does
      # NOT build the C# project itself in headless mode: it looks for a built
      # assembly and, not finding one, reports `.NET: Assemblies not found` and
      # carries on far enough to look like a different problem.
      - name: Build the game
        run: dotnet build game/RedRepublic.csproj -c Debug --nologo

      # A standalone build, pinned. The editor on a desktop auto-updates and can
      # break the build with no commit to blame; CI is where a pinned version
      # actually gets used.
      - name: Fetch Godot
        run: |
          curl -sSLo godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_mono_linux_x86_64/Godot_v4.7.1-stable_mono_linux.x86_64 godot-bin
          chmod +x godot-bin

      # **Twice, and only the second is believed.** A pass imports assets, and a
      # resource that references one can only resolve on a pass after the one
      # that imported it — `ui/theme.tres` names six font files, so on a virgin
      # checkout the first pass reports a parse error for a theme that is
      # perfectly correct, and the project settings point the default GUI theme
      # at it.
      - name: Import
        run: |
          ./godot-bin --headless --import --path game 2>&1 | tee first-import.log
          ./godot-bin --headless --import --path game 2>&1 | tee import.log
          if grep -qiE "Parse Error|Failed to load|Cannot get class" import.log; then
            echo "::error::the Godot project does not load — see the log above"
            exit 1
          fi

      # `--check` founds a republic, prints the line saying so, and quits. Both
      # alternatives are wrong here: a capture waits for a frame that never
      # arrives under `--headless` and spins for ever, and a plain run never
      # exits — so the job would hang on a success and depend on a timeout to
      # report it.
      #
      # A run that quietly does nothing prints exactly as much as one that
      # worked, which is why the success lines are grepped for rather than the
      # exit code being trusted.
      - name: Load a republic
        run: |
          ./godot-bin --headless --path game -- --check 2>&1 | tee run.log
          if grep -qiE "SCRIPT ERROR|Unhandled exception|unauthored" run.log; then
            echo "::error::the republic did not load cleanly — see the log above"
            exit 1
          fi
          if ! grep -q "^tables ok" run.log; then
            echo "::error::the balance table did not arrive"
            exit 1
          fi
          if ! grep -q "^founded " run.log; then
            echo "::error::no republic was founded"
            exit 1
          fi

      # The theme is a committed artifact generated from the palette. If the two
      # have drifted the game ships a look nobody chose, so the generator is run
      # and the working tree checked for a change.
      - name: The theme matches its palette
        run: |
          ./godot-bin --headless --path game -- --build-theme
          if ! git diff --quiet game/ui/theme.tres; then
            echo "::error::ui/theme.tres is stale — run --build-theme and commit it"
            exit 1
          fi

      # And the same for the balance table's checksum, which is what catches a
      # figure that arrived one ulp out.
      - name: The balance table's checksum matches its contents
        run: |
          ./godot-bin --headless --path game -- --stamp-balance
          if ! git diff --quiet game/data/manifest.json; then
            echo "::error::the manifest's checksum is stale — run --stamp-balance and commit it"
            exit 1
          fi
