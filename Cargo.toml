[workspace]
resolver = "3"
members = ["crates/sim", "crates/red-republic-shell"]
# There used to be an `exclude = ["archive"]` here, because the frozen 1.x build
# carried its own Tauri Rust package inside this directory and Cargo refused to
# build the workspace without being told to ignore it. The 1.x build was moved
# out of the repository on 2026-07-30, so there is nothing left to exclude.

[workspace.package]
# CalVer: YYYY.M.PATCH, and this is the only version number in the repository.
# The menu reads it off the loaded binary and tools/package.ps1 reads it from
# cargo metadata for the installer and the executable's version resource, so a
# release is one edit here.
#
# Bump the year and month at release time; the patch counts releases within that
# month and returns to 0 when either changes. Neither leading zeros nor a
# pre-release suffix: `the_version_is_three_plain_numbers` in build_info.rs holds
# the shape, because a Windows FILEVERSION is four plain integers and an invalid
# one fails the export with a message about the preset rather than the version.
#
# Chosen over semver deliberately. Semver's promise is about an API and this
# ships no API; what a date says instead is how current a build is, which is the
# question somebody holding an installer actually has. The cost, stated because
# it is real: a version number can now never announce that the game is finished.
# That signal lives in the goal at the top of CLAUDE.md and its three conditions,
# which is the only place that ever tested it anyway.
version = "2026.7.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
authors = ["Noah Sabaj"]

# The simulation is hot even while developing — a headless 90-day determinism
# run is the normal test, not an occasional one. opt-level 1 keeps `cargo test`
# usable without giving up debug assertions.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Determinism note: Rust does not enable fast-math-style float reassociation,
# so the same binary on the same instruction set reproduces float results
# exactly. Nothing here may turn that off — no `-ffast-math` equivalent, no
# `core::intrinsics::fadd_fast`. Cross-MACHINE reproducibility is required only
# for map generation, which is tested separately.
