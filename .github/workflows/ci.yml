name: CI

# The gate, run on the machine that is not Noah's.
#
# The frozen 1.x build used to sit in `archive/` and had to be excluded from the
# Cargo workspace so nothing here touched it. It was moved out of the repository
# on 2026-07-30, so there is nothing left to exclude and nothing left to avoid.

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A warning that is not an error is a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  gate:
    # Two operating systems on purpose, and it is not redundancy.
    #
    # Map generation must reproduce ACROSS MACHINES — a shared seed is a promise
    # between players — so `generated_geology_is_pinned_across_machines` and
    # `generated_ground_is_pinned_across_machines` are claims that can only be
    # tested somewhere other than where the pin was taken. Running the suite on
    # a second OS and a second CPU vendor is the cheapest real evidence for that
    # rule available, and until this workflow existed nothing had ever checked
    # it anywhere but one desktop.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Release-mode baselines are measurements rather than assertions, so they
      # are recorded in the log and never gate. Their numbers come from whatever
      # hardware the runner happened to be, which is why nothing here compares
      # them to a threshold — the pinned figures in the repo are Noah's machine.
      - name: Baselines
        run: cargo test --release --test baselines -- --nocapture

  # Does the game actually load? Nothing in this repository asked that until now.
  #
  # `cargo test` does not parse GDScript, and on 2026-07-29 that turned out to
  # have been hiding two breaks at once, both of which made the game refuse to
  # start at all:
  #
  #   * `Overlays.Mode.SNOW` was referenced from three files, including
  #     `overlays.gd` itself, and the enum never got the variant. Every `.gd` in
  #     the project failed to parse. Shipped in M11.
  #   * Thirteen buildings had no row in `building_art.gd`, so the art guard —
  #     which works, and is the right guard — fired an assertion at load.
  #
  # The exposure guard could not see either. It is a source *scan*: it found the
  # string it was looking for in a file that cannot load, and reported the view
  # exposed. A scan over text cannot tell you the text is valid.
  #
  # This job runs on Linux only. The check is "does the project parse and does
  # the extension load", which is not an OS-specific question, and a second
  # runner downloading Godot buys nothing the Rust matrix above does not already
  # cover.
  loads:
    runs-on: ubuntu-latest
    # A GDScript parse error does not fail this job, it HANGS it: main.gd never
    # loads, so `--check` never reaches the quit() that ends the run, and the
    # process sits there for ever printing nothing. That cost two eight-minute
    # stalls on 2026-07-30 before anyone killed it. The import step above catches
    # most parse errors, but a timeout is what turns "hung" into "failed" for the
    # ones it does not.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The cdylib has to exist before Godot can load it. Debug rather than
      # release: this job is asking whether the project loads, not how fast it
      # runs, and a debug build is minutes cheaper.
      - name: Build the shell
        run: cargo build -p red-republic-shell

      # A standalone build from godotengine.org, pinned. The editor on Noah's
      # desktop comes from Steam and auto-updates, which can break the build with
      # no commit to blame; CI is where a pinned version actually gets used.
      - name: Fetch Godot
        run: |
          curl -sSLo godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot-bin
          chmod +x godot-bin

      # A virgin checkout has no `.godot/`, and without one no GDExtension class
      # resolves — the tell is `Cannot get class` with no `Initialize godot-rust`
      # line. So the import pass comes first, and its own output is checked:
      # `--import` exits 0 on a project full of parse errors.
      #
      # **Twice, and only the second is checked.** A pass imports assets; a
      # resource that *references* an asset can only resolve on a pass after the
      # one that imported it. `ui/theme.tres` names six font files, so on a
      # virgin checkout the first pass reports
      # `Parse Error: [ext_resource] referenced non-existent resource` for a
      # theme that is perfectly correct — and the project settings point the
      # default GUI theme at it, so this is not a corner anybody can avoid.
      # Reproduced by deleting `godot/.godot/` locally: two errors on the first
      # pass, none on the second.
      - name: Import
        run: |
          ./godot-bin --headless --import --path godot 2>&1 | tee first-import.log
          ./godot-bin --headless --import --path godot 2>&1 | tee import.log
          if grep -qiE "Parse Error|Failed to load script|Cannot get class" import.log; then
            echo "::error::the Godot project does not load — see the log above"
            exit 1
          fi

      # And then actually run it. Parsing is not loading: the building-art guard
      # is an `assert` at scene setup, so only a real run reaches it.
      #
      # `--check` founds a republic, prints the line saying so, and quits. It
      # exists because both alternatives are wrong here: `--shot` awaits
      # `RenderingServer.frame_post_draw`, which never arrives under `--headless`
      # and spins for ever printing nothing, and a plain `--advance` run never
      # exits — so the job would hang on a success and depend on a timeout to
      # report it.
      - name: Load a republic
        run: |
          ./godot-bin --headless --path godot -- --check 2>&1 | tee run.log
          if grep -qiE "SCRIPT ERROR|Assertion failed|unauthored" run.log; then
            echo "::error::the republic did not load cleanly — see the log above"
            exit 1
          fi
          # A run that quietly does nothing prints nothing, which is the failure
          # these lines exist to tell apart from success. Same reason the founding
          # print exists at all.
          if ! grep -q "^founded " run.log; then
            echo "::error::no republic was founded"
            exit 1
          fi
          # `--check` also writes a save, lists it, reads it back and compares.
          # That covers the part only the shell can get wrong — the temporary-file
          # write and rename, the preview marshalling, the listing — and it is
          # where a bug costs a player their republic. It earned this line
          # immediately: the first run failed with `os error 123`, because the
          # Rust side was being handed Godot's `user://` virtual path.
          if ! grep -q "^save check ok" run.log; then
            echo "::error::this build cannot round-trip its own save"
            exit 1
          fi
          # "Settings that work" is a clause of the release standard, and looking
          # at the screen only shows the controls exist. This is the half a player
          # would notice: a value written on one run being there on the next.
          if ! grep -q "^settings check ok" run.log; then
            echo "::error::this build cannot round-trip its own settings"
            exit 1
          fi
          # The map starts empty, so contracting is the only path from a founded
          # republic to a built anything. If it breaks, the symptom is a map that
          # stays empty — which looks exactly like a player who has not started.
          if ! grep -q "^build check ok" run.log; then
            echo "::error::this build cannot put up a building"
            exit 1
          fi

  # Does it install on a machine that has never heard of Rust or Godot?
  #
  # This is the one condition in the goal with no automatic check, and it is the
  # one that will drift: everything else is measured, and "a stranger could
  # install it" was attention alone. A GitHub runner is a better witness for it
  # than the development desktop, which has Godot, Steam, Rust, the export
  # templates and the built cdylib all sitting in the right places -- an export
  # that quietly depended on any of those would work there and nowhere else.
  #
  # So: export, build the installer, install it silently, run the *installed*
  # game, and uninstall it again. The install step is what makes the claim in
  # CLAUDE.md a tested one rather than a sentence.
  package:
    runs-on: windows-latest
    # Same reason as `loads`, plus this job runs the game twice more.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Only the two templates a Windows x86_64 release export actually reads,
      # plus the version.txt Godot matches them by. The full .tpz is 1.2 GB and
      # holds every platform; caching the extracted subset instead keeps this at
      # about 105 MB and turns every run after the first into a cache hit.
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: templates
          key: godot-export-templates-4.7.1-stable-windows-x86_64

      - name: Fetch export templates
        if: steps.templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sSLo tpz.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          # The archive holds a single top-level templates/ directory, which is
          # already the name this job caches under.
          unzip -q tpz.zip
          test -f templates/version.txt
          find templates -type f \
            ! -name 'version.txt' \
            ! -name 'windows_release_x86_64.exe' \
            ! -name 'windows_release_x86_64_console.exe' \
            -delete
          du -sh templates
          ls templates

      - name: Install export templates
        shell: bash
        run: |
          dest="$APPDATA/Godot/export_templates/$(cat templates/version.txt)"
          mkdir -p "$dest"
          cp templates/* "$dest/"
          ls "$dest"

      # The editor build, pinned, from godotengine.org rather than the
      # auto-updating Steam copy the development desktop uses.
      - name: Fetch Godot
        shell: bash
        run: |
          curl -sSLo godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_win64.exe godot.exe

      # Pinned rather than whatever the runner image happens to ship, because an
      # installer built by a different compiler than the one this was written
      # against is a different artifact.
      # pwsh rather than bash, and that is not a style choice: Inno Setup's
      # installer takes a native Windows path in /DIR, and bash's $PWD on a
      # Windows runner is a `/d/a/...` MSYS path. Handing it one does not fail --
      # the silent installer simply never returns, which reads as a slow download
      # rather than a wrong argument.
      - name: Fetch Inno Setup
        shell: pwsh
        run: |
          curl.exe -sSLo is6.exe `
            https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          $p = Start-Process -FilePath "$PWD\is6.exe" -Wait -PassThru -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$PWD\inno"
          if ($p.ExitCode -ne 0) { throw "the Inno Setup installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$PWD\inno\ISCC.exe")) { throw "no ISCC.exe after installing Inno Setup" }

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Godot "$PWD/godot.exe" -Iscc "$PWD/inno/ISCC.exe"

      # The claim under test: a machine with no Rust on the PATH of the installed
      # game, no Godot, no Steam, and no build tree can run it. Installed to a
      # scratch directory rather than the default so the uninstall check below has
      # somewhere unambiguous to look.
      - name: Install it
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $target = "$PWD/installed"
          $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=$target"
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }
          Get-ChildItem $target

      - name: Run the installed game
        shell: pwsh
        run: |
          $check = & "$PWD/installed/RedRepublic.console.exe" --headless -- --check 2>&1 | Out-String
          Write-Host $check
          if ($check -match 'SCRIPT ERROR|Assertion failed|unauthored') {
            throw "the installed game did not load cleanly"
          }
          if ($check -notmatch 'save check ok') {
            throw "the installed game cannot round-trip its own save"
          }
          # On a clean machine this is the first time settings are written at all,
          # which is exactly the case a developer machine cannot reproduce.
          if ($check -notmatch 'settings check ok') {
            throw "the installed game cannot round-trip its own settings"
          }
          # `release` is what distinguishes the shipped artifact from a
          # development build that happens to have been copied here.
          if ($check -notmatch 'build \d+\.\d+\.\d+: release') {
            throw "the installed game does not identify as a shipped build"
          }

      # An installer that cannot be cleanly removed is not finished. Checked
      # because it is cheap and because nothing else would ever notice.
      - name: Uninstall it
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD/installed/unins000.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          if (Test-Path "$PWD/installed/RedRepublic.exe") {
            Get-ChildItem "$PWD/installed"
            throw "the uninstaller left the game behind"
          }

      # The installer is deliberately NOT uploaded as a workflow artifact.
      #
      # This repository is public, and artifacts on a public repository are
      # downloadable by anyone who can see the Actions tab. Uploading would mean
      # every CI run publishes a playable Windows build to the internet, which is
      # distribution — and building the installer is part of finishing while
      # putting it in front of anyone is a separate decision that belongs to Noah,
      # in the conversation where it happens.
      #
      # Nothing is lost from the check: the job already exports it, installs it,
      # runs the installed game and uninstalls it again, which is the whole claim
      # under test. The artifact would only have been a convenience.
      #
      # To get a build, run `pwsh tools/package.ps1` locally. If this should
      # publish one day, `actions/upload-artifact` on `dist/*-setup.exe` is the
      # line to add, and it should go with a tag rather than with every push.
      - name: Report the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          "built {0} ({1:N1} MB), not uploaded — see the note in ci.yml" -f `
            $setup.Name, ($setup.Length / 1MB)
