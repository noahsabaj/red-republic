[package]
name = "red-republic-sim"
description = "The Red Republic simulation — headless, deterministic, engine-independent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# No renderer, no windowing, no engine — that independence is what lets the
# shell (Bevy / wgpu / other) be chosen later on measured evidence rather than
# guessed at now. serde is not an engine, and deriving serialization is
# strictly better than hand-writing it: the archived build's save round-trip
# test existed to catch fields someone forgot to persist, and a derive removes
# that class of bug rather than testing for it.
[dependencies]
serde = { version = "1", features = ["derive"] }

# The ECS, standalone — no renderer, no app, no scheduler plugins. Using the
# same crate Bevy is built on keeps that shell option additive rather than a
# rewrite, and costs nothing if the shell ends up being something else.
bevy_ecs = { version = "0.19", default-features = false }

# The save wire format has ONE hard requirement, found by measurement: it must
# round-trip f64 bit-exactly. serde_json does not — 91,767 of 200,000 sampled
# f64 values came back different, because its parser is not correctly rounded
# even when the digits it wrote were right. postcard stores the bit pattern.
#
# This is a real dependency, not a dev one, because the crate has to OWN the
# format. A `Save` handed out as a serde value is a format the caller picks,
# and a shell that reached for JSON would silently reintroduce exactly the
# corruption this requirement exists to prevent — with the guard test still
# passing, because the guard would be testing a format nothing uses.
postcard = { version = "1", features = ["use-std"] }
