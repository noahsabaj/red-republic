[package]
name = "red-republic-shell"
description = "The Godot shell. The only Rust in this repository that knows an engine exists."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# A cdylib because Godot loads it as a GDExtension.
#
# The name is long on purpose. Crate names shorter than about thirteen bytes
# trip a PDB-rename warning on Windows and fall back to loading the original
# PDB, which silently breaks hot reload — measured on this machine, not read
# somewhere.
name = "red_republic_shell"
crate-type = ["cdylib"]

[dependencies]
# The simulation, with NO features. `fixtures` is deliberately not enabled here
# and never may be: it is what lets the benchmark harness stand buildings up
# and write to the population directly, and a shell that could do that would be
# outside the single-writer rule. This line is the enforcement.
red-republic-sim = { path = "../sim" }

# gdext. 0.5 compiles against API 4.6 and runs on the 4.7.1 runtime, because
# the forward-compatibility rule is runtime >= API. The proof it loaded is the
# `Initialize godot-rust (API v4.6.stable.official, runtime v4.7.1...)` line at
# startup; without it you get `Cannot get class` and a placeholder node.
godot = "0.5"
